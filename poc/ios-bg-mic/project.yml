# XcodeGen 定義。`xcodegen generate` で BgMicPoC.xcodeproj を生成する（CI で実行）。
name: BgMicPoC
options:
  bundleIdPrefix: dev.earphoneagent.poc
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  BgMicPoC:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: BgMic PoC
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: "バックグラウンドでのマイク継続取得を検証するために使用します。音声そのものは保存せず、音量レベルのみ記録します。"
        UIBackgroundModes:
          - audio
        # ログファイルを「ファイル」アプリから取り出せるようにする
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.earphoneagent.poc.bgmic
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  BgMicPoC:
    build:
      targets:
        BgMicPoC: all
